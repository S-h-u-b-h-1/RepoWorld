name: One-time RepoWorld authentic demo capture
on:
  push:
    branches: [main]
    paths:
      - "scripts/record_public_demo.py"
      - ".github/workflows/public-demo-capture.yml"
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright httpx
      - name: Verify real Chrome available
        run: google-chrome --version
      - name: Record public production app, without any AI call
        run: python scripts/record_public_demo.py
      - name: Remove guest session data before artifact upload
        if: always()
        run: rm -f evidence/public-demo/guest-state.json
      - name: Upload real footage and shot markers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repoworld-real-demo-footage
          path: evidence/public-demo/
          if-no-files-found: warn
          retention-days: 7
