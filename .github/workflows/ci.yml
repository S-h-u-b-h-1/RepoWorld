name: RepoWorld CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q app/tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend syntax check
        run: |
          node --check app/static/world.js
          node --check app/static/app.js
      - name: Frontend interaction and renderer tests
        run: node --test app/tests/test_world.cjs app/tests/test_app.cjs
      - name: Compile all backend modules
        run: python -m compileall -q app
