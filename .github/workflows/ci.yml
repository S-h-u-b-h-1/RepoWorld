name: RepoWorld CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q app/tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend syntax check
        run: |
          node --check app/static/world.js
          node --check app/static/app.js
          node --check app/static/browser-radar.js
      - name: Frontend interaction and renderer tests
        run: node --test app/tests/test_world.cjs app/tests/test_app.cjs app/tests/test_browser_radar.cjs
      - name: Static launch page tests
        run: |
          node --check launch/launch.js
          node --test launch/tests/test_launch.cjs
          test -s evidence/restored-city-1440.png
          test -s app/static/favicon.svg
      - name: Compile all backend modules
        run: python -m compileall -q app scripts
      - name: Hackathon entry preflight
        run: python scripts/check_build_league.py
      - name: Public release archive integrity and secret scan
        run: |
          git archive --format=zip --prefix=RepoWorld/ HEAD -o /tmp/repoworld-release.zip
          python scripts/audit_public_release.py /tmp/repoworld-release.zip
