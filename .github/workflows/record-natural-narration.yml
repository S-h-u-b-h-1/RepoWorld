name: RepoWorld one-time local natural narration
on:
  push:
    branches: [main]
    paths:
      - "scripts/synthesize_demo_narration.py"
      - ".github/workflows/record-natural-narration.yml"

permissions:
  contents: read

jobs:
  natural-narration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline voice runtime
        run: |
          python -m pip install --disable-pip-version-check "kokoro-onnx>=0.6,<0.7" soundfile numpy
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng
      - name: Fetch openly licensed voice model, temporarily
        run: |
          mkdir -p "$RUNNER_TEMP/kokoro"
          curl -fL --retry 3 --retry-delay 3 \
            -o "$RUNNER_TEMP/kokoro/kokoro-v1.0.onnx" \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx"
          curl -fL --retry 3 --retry-delay 3 \
            -o "$RUNNER_TEMP/kokoro/voices-v1.0.bin" \
            "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin"
          ls -lh "$RUNNER_TEMP/kokoro/" | sed -n '2,3p'
      - name: Synthesize full RepoWorld voiceover, with cue times
        run: |
          python scripts/synthesize_demo_narration.py \
            --model "$RUNNER_TEMP/kokoro/kokoro-v1.0.onnx" \
            --voices "$RUNNER_TEMP/kokoro/voices-v1.0.bin" \
            --voice am_michael \
            --output evidence/demo-narration
      - name: Validate playable audio
        run: |
          python - <<'PY'
          import soundfile as sf
          import numpy as np
          path = "evidence/demo-narration/RepoWorld_Natural_Voiceover.wav"
          audio, sample_rate = sf.read(path)
          assert audio.ndim == 1 and sample_rate == 24000
          assert 55 <= len(audio) / sample_rate <= 175
          assert np.isfinite(audio).all() and 0.02 < np.max(np.abs(audio)) <= 1
          print(f"PASS narration WAV duration={len(audio)/sample_rate:.2f}s")
          PY
      - name: Upload narration WAV, per-scene tracks and exact timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repoworld-natural-narration
          path: evidence/demo-narration/
          if-no-files-found: warn
          retention-days: 7
